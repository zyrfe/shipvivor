[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# glam must stay on the version bevy_math uses, or `Vec2` stops unifying across crates.
[workspace.dependencies]
glam = { version = "0.33", default-features = false, features = ["std"] }

[package]
name = "shipvivor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
shipvivor-compass = { path = "crates/compass" }
shipvivor-navigation = { path = "crates/navigation" }
shipvivor-campaign = { path = "crates/campaign" }
shipvivor-encounter = { path = "crates/encounter" }
shipvivor-ensign = { path = "crates/ensign" }
shipvivor-shipyard = { path = "crates/shipyard" }
shipvivor-acoustics = { path = "crates/acoustics" }
shipvivor-sea = { path = "crates/sea" }
bevy = { version = "=0.20.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit", "x11",
    "bevy_pbr", "bevy_ui_render", "default_font", "keyboard", "mouse", "bevy_audio",
] }
# Encodes dev captures. Bevy's own `png` feature would rebuild most of Bevy.
png = "0.18"

[features]
default = ["dev-tools"]
# The run logbook (`work/runs`) and the ` capture key (`work/screenshots`). On in every
# build, `--release` included. Build with `--no-default-features` to ship without them.
dev-tools = []

[profile.dev]
debug = 1

# The mixer runs on the audio thread and must keep up in a debug build.
[profile.dev.package.shipvivor-acoustics]
opt-level = 3

# The wake transforms its whole patch twice on every fixed step.
[profile.dev.package.shipvivor-sea]
opt-level = 3

# A spin of the customise screen's wheel repaints every pattern tile at each turn.
[profile.dev.package.shipvivor-ensign]
opt-level = 3
