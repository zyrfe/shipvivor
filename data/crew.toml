    { repairs = 0.15 },
    { repairs = 0.30 },
    { repairs = 0.45 },
]

# Experience per knocked-out part brought back.
[[skill]]
id = "shoring"
name = "Shoring"
card = "Knocked-out parts return at {restore%}"
