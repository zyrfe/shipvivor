# Breakwater's wardroom: the officers who can be dealt as leader cards, the skills they
# bring, and how those skills rank up.
#
# Edit and save while the game runs: it reloads this file within a second. A file that
# doesn't parse is ignored, with the reason logged, and the game keeps what it had.
# The game reads, in order: the file named by SHIPVIVOR_CREW_FILE, data/crew.toml beside
# the executable, data/crew.toml in the folder it was started from, and finally the copy
# built into the game.
#
# Fractions are written as 0.25 for 25%. Times are seconds, distances metres.

# --- Ranking up --------------------------------------------------------------------------

[growth]
# Experience a skill needs to reach each tier past the first: tier II, then tier III.
# A skill can't have more tiers than this list allows (one more than its length).
experience = [100, 250]
# Officer points each star of a leg pays, to spend in the yard on any skill.
points_per_star = 1
# Experience one officer point buys.
experience_per_point = 50

# --- Rank --------------------------------------------------------------------------------
# An officer's rank follows the skill tiers they hold, all skills together, so a skill
# ranking up can bring a promotion. Lowest first; each needs more tiers than the last.
# Officers who bring two skills top out at 6 tiers, three skills at 9.
#
# lace is the gold on the shoulder board, from the outer end in: w a wide stripe, n a thin
# one, b a commodore's broad band. The post's colour shows between the stripes.

[[rank]]
name = "Sub-Lieutenant"
short = "Sub-Lt."
lace = "w"
tiers = 0

[[rank]]
name = "Lieutenant"
short = "Lt."
lace = "ww"
tiers = 3

[[rank]]
name = "Lieutenant Commander"
short = "Lt. Cdr."
lace = "wnw"
tiers = 4

[[rank]]
name = "Commander"
short = "Cdr."
lace = "www"
tiers = 6

[[rank]]
name = "Captain"
short = "Capt."
lace = "wwww"
tiers = 8

# --- Leader hands ------------------------------------------------------------------------

[hand]
# Cards in a leader hand.
cards = 3
# Chance of a leader hand after a leg, by stars earned: 0, 1, 2, 3.
chance = [0.0, 0.4, 0.7, 1.0]

# How often each rarity is drawn, by stars earned on the leg: 0, 1, 2, 3.
# Better legs lean rarer.
[hand.weight]
common = [70, 60, 45, 30]
uncommon = [25, 30, 40, 45]
rare = [5, 10, 15, 25]

# --- Posts -------------------------------------------------------------------------------
# One officer holds each post. A new officer for a post replaces the one there.

[[post]]
id = "gunnery"
name = "Gunnery"
colour = "#f06858"

[[post]]
id = "signals"
name = "Signals"
colour = "#9098ff"

[[post]]
