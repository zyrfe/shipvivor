tiers = [
    { restore = 0.25 },
    { restore = 0.40 },
    { restore = 0.60 },
]

# Experience per tonne of water pumped out.
[[skill]]
id = "counterflooding"
name = "Counterflooding"
card = "Flooding drag -{drag%}"
experience = 1.0
