id = "bomber_strike"
name = "Bomber Strike"
key = true
experience = 1.0
tiers = [
    { bombers = 6, per_round = 1, pick_target = false, text = "Once a round, 6 light bombers hit the nearest port facility" },
    { bombers = 9, per_round = 1, pick_target = true, text = "9 bombers, on the facility you mark" },
    { bombers = 9, per_round = 2, pick_target = true, text = "Twice a round" },
]

# Nothing to count: ranks up from officer points.
[[skill]]
id = "recon_flight"
name = "Recon Flight"
experience = 0.0
tiers = [
    { hidden_fleet = false, spotter = 0.0, text = "The chart shows every base from the start" },
    { hidden_fleet = true, spotter = 0.0, text = "And any hidden fleet" },
    { hidden_fleet = true, spotter = 0.15, text = "A spotter plane over the marked ship: -15% scatter on her" },
]

# Experience per point of damage the salvos do.
[[skill]]
id = "fleet_gunfire"
name = "Fleet Gunfire"
key = true
experience = 1.0
tiers = [
    { per_round = 1, barrels = 6, bore = 15, text = "Once a round, a heavy salvo from over the horizon on the mark" },
    { per_round = 2, barrels = 6, bore = 15, text = "Twice a round" },
