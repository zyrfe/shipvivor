# --- Career ------------------------------------------------------------------------------
# A career captain carries over from run to run, with their skill tiers. Each run, won or
# lost, pays career points; spend them before the next run on the captain's own skills.

[career]
# Career points each star of the run pays when it ends.
points_per_star = 1
# Career points more for sinking the Iron Regent.
points_for_a_win = 5
# Career points to raise a captain's skill to tier II, then tier III.
tier_cost = [6, 12]

