# --- Skills ------------------------------------------------------------------------------
# Each skill's id is fixed by the game. So are the numbers its tiers
# must give, and what its `experience` rate counts (noted above each skill).
#
# `card` is the line the card shows for a tier, with {name} replaced by that tier's
# number and {name%} by it as a percentage. A tier's own `text` replaces the card line.
# `key = true` marks a skill the player sets off with a key.

# Experience per point of damage dealt while a fury is on.
[[skill]]
id = "gun_fury"
name = "Gun Fury"
key = true
card = "{seconds} s at {reload%} reload time, {cooldown} s cooldown"
experience = 1.0
tiers = [
    { seconds = 10, reload = 0.5, cooldown = 60 },
    { seconds = 12, reload = 0.5, cooldown = 50 },
    { seconds = 15, reload = 0.5, cooldown = 40 },
]

# Experience per hit from a salvo corrected by an earlier one at the same ship.
[[skill]]
id = "spotting_corrections"
name = "Spotting Corrections"
card = "Each salvo on the same ship -{per_salvo%} scatter, to -{most%}"
experience = 2.0
tiers = [
    { per_salvo = 0.15, most = 0.30 },
    { per_salvo = 0.20, most = 0.40 },
    { per_salvo = 0.25, most = 0.50 },
]

# Experience per hit on a ship making over half her speed.
[[skill]]
id = "rate_plot"
name = "Rate Plot"
card = "-{scatter%} scatter against ships under way"
experience = 2.0
tiers = [
    { scatter = 0.10 },
    { scatter = 0.20 },
    { scatter = 0.30 },
]

# Experience per point of damage to a ship first seen on radar.
[[skill]]
id = "radar_operator"
name = "Radar Operator"
card = "Contacts beyond line of sight, out to {range} m"
experience = 1.0
tiers = [
    { range = 1500, lay_guns = false },
    { range = 2500, lay_guns = false },
    { range = 2500, lay_guns = true, text = "Out to 2500 m, and the guns lay on radar contacts" },
]

# Experience per point of damage to the marked threat.
[[skill]]
id = "target_identification"
name = "Target Identification"
experience = 1.0
tiers = [
    { show_aim = false, damage = 0.0, text = "Marks the most pressing threat" },
    { show_aim = true, damage = 0.0, text = "Also shows its aim and reload" },
    { show_aim = true, damage = 0.15, text = "+15% damage against it" },
]

# Experience per hit landed beyond the weapon's stock reach.
[[skill]]
id = "range_boost"
name = "Range Boost"
card = "All weapons +{reach%} reach"
experience = 2.0
tiers = [
    { reach = 0.20 },
    { reach = 0.30 },
    { reach = 0.40 },
]

# Nothing to count: ranks up from officer points.
[[skill]]
id = "fall_of_shot"
name = "Fall of Shot"
experience = 0.0
tiers = [
    { every_shell = false, torpedoes = false, text = "Incoming main-gun salvos mark where they'll land" },
    { every_shell = true, torpedoes = false, text = "Every incoming shell marks where it'll land" },
    { every_shell = true, torpedoes = true, text = "Every shell, and torpedo tracks" },
]

# Nothing to count: ranks up from officer points.
[[skill]]
id = "forced_draught"
name = "Forced Draught"
card = "+{speed%} speed and acceleration"
experience = 0.0
tiers = [
    { speed = 0.08 },
    { speed = 0.14 },
    { speed = 0.20 },
]

# Experience per second steamed on a cooked engine.
[[skill]]
id = "steam_held"
name = "Steam Held"
card = "A cooked engine runs at {power%} instead of stalling"
experience = 1.0
tiers = [
    { power = 0.35 },
    { power = 0.50 },
    { power = 0.70 },
]

# Experience per enemy round that misses her through smoke.
[[skill]]
id = "smoke_screen"
name = "Smoke Screen"
key = true
card = "{seconds} s screen, {cooldown} s cooldown"
experience = 3.0
tiers = [
    { seconds = 20, cooldown = 90 },
    { seconds = 30, cooldown = 75 },
    { seconds = 40, cooldown = 60 },
]

# Nothing to count: ranks up from officer points.
[[skill]]
id = "hard_over"
name = "Hard Over"
card = "Rudder +{rudder%}"
experience = 0.0
tiers = [
    { rudder = 0.15 },
    { rudder = 0.25 },
    { rudder = 0.35 },
]

# Experience per hull point the second crew mends.
[[skill]]
id = "second_repair_crew"
name = "Second Repair Crew"
experience = 1.0
tiers = [
    { power = 1.0, text = "A second repair party: twice the repair power" },
    { power = 1.25, text = "Each party +25%" },
    { power = 1.5, text = "Each party +50%" },
